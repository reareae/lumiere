<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière - Qirinj Artizanalë</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="lumiere-topbar">
        <div class="lumiere-topbar__links">
            <a href="#" class="lumiere-topbar__link">Contact</a>
            <a href="#" class="lumiere-topbar__link">About</a>
        </div>
        <div class="lumiere-topbar__branding">
            <span class="lumiere-topbar__logo-text">LOGO</span>
        </div>
    </div>

    <header class="lumiere-header">
        <div class="lumiere-header__main-row">
            <div class="lumiere-header__spacer"></div>
            
            <div class="lumiere-header__logo-container">
                <h1 class="lumiere-header__logo">lumiere</h1>
            </div>
            
            <div class="lumiere-header__actions">
                <div class="lumiere-search">
                    <input type="text" class="lumiere-search__input" placeholder="Kërko...">
                </div>
                <div class="lumiere-actions__icons">
                    <i class="fa-solid fa-basket-shopping lumiere-actions__icon" title="Shporta"></i>
                    <i class="fa-regular fa-user lumiere-actions__icon" title="Profili"></i>
                </div>
            </div>
        </div>
        
        <nav class="lumiere-navbar">
            <a href="#" class="lumiere-navbar__link">Blogu</a>
            <a href="#" class="lumiere-navbar__link">Koleksionet</a>
            <a href="#" class="lumiere-navbar__link">Gift</a>
            <a href="#" class="lumiere-navbar__link">Dyqanet</a>
        </nav>
    </header>

    <section class="lumiere-hero">
        <div class="lumiere-hero__container">
            <div class="lumiere-moto-box">
                <p class="lumiere-moto-box__title">"Ndriço çdo moment, frymëzo çdo ndjesi."</p>
                <button class="lumiere-moto-box__button">Button</button>
            </div>
        </div>
    </section>

</body>
</html>
